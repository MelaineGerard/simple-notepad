name: simple-notepad
version: 0.3.0
summary: A simple, lightweight notepad — like Windows Notepad, but for Linux.
description: |
  Simple Notepad is a lightweight plain text editor for Linux built with Yaru.
  Work with independent document tabs, find and replace text, choose file
  encodings, and use optional syntax highlighting for common text formats.
  Unsaved-change confirmations protect documents when closing tabs or quitting.
  Session recovery reopens tabs and recovers local drafts after restarting.
  Includes focus mode, undo/redo, keyboard shortcuts, live document counters,
  printing, dark mode and configurable editor fonts.


confinement: strict
base: core22
grade: stable

architectures:
  - build-on: [ amd64 ]
  - build-on: [ arm64 ]

apps:
  simple-notepad:
    command: simple-notepad
    extensions: [gnome]
    slots:
      - dbus-simple-notepad
    plugs:
      - home
      - removable-media

parts:
  simple-notepad:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
  zenity-integration:
    plugin: nil
    stage-snaps:
      - zenity-integration


slots:
  dbus-simple-notepad:
    interface: dbus
    bus: session
    name: fr.melaine-gerard.simple-notepad
