name: simple_notepad
description: A new Flutter project.
publish_to: 'none'

version: 0.1.5+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  file_picker: ^13.0.0
  flutter:
    sdk: flutter
  handy_window: ^0.4.2
  pdf: ^3.12.0
  printing: ^5.14.3
  shared_preferences: ^2.5.5
  yaru: ^11.0.0

# image 4.11 uses decodeLazy, introduced in archive 4.4.
dependency_overrides:
  archive: 4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets: []

