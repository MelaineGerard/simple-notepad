name: Release

on:
  release:
    types: [published]
  push:
    branches: ['release/*']

jobs:
  build-and-upload:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            deb_arch: amd64
            flutter_arch: x64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            deb_arch: arm64
            flutter_arch: arm64

    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(sed -n 's/^version: //p' pubspec.yaml | cut -d+ -f1)
          TAG="${RELEASE_TAG:-$VERSION}"
          test "${TAG#v}" = "$VERSION"
          if [ "${{ github.event_name }}" = push ]; then
            test "${GITHUB_REF_NAME}" = "release/${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        if: matrix.flutter_arch != 'arm64'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Flutter (ARM64)
        if: matrix.flutter_arch == 'arm64'
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable /opt/flutter
          echo "/opt/flutter/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev ruby ruby-dev libfuse2t64 rpm xvfb dbus-x11 libgl1-mesa-dri

      - name: Install fpm
        run: sudo gem install fpm

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Linux
        run: flutter build linux --release

      - name: Validate native startup
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GDK_BACKEND: x11
        run: |
          BINARY="build/linux/${{ matrix.flutter_arch }}/release/bundle/simple-notepad"
          test -x "$BINARY"
          set +e
          dbus-run-session -- xvfb-run -a timeout --kill-after=5s 10s "$BINARY" > native-startup.log 2>&1
          STATUS=$?
          set -e
          cat native-startup.log
          test "$STATUS" -eq 124
          if grep -E 'Unhandled [Ee]xception|EXCEPTION CAUGHT BY' native-startup.log; then
            exit 1
          fi

      - name: Create tar.gz
        run: |
          tar -czf "simple-notepad-${{ steps.version.outputs.tag }}-linux-${{ matrix.arch }}.tar.gz" \
            -C build/linux/${{ matrix.flutter_arch }}/release bundle

      - name: Create AppImage
        run: |
          wget -q "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x "appimagetool-${{ matrix.arch }}.AppImage"

          mkdir AppDir
          cp -r "build/linux/${{ matrix.flutter_arch }}/release/bundle/." AppDir/

          sed 's|Exec=simple-notepad[[:space:]]*|Exec=simple-notepad|' \
            snap/gui/simple-notepad.desktop \
            | sed 's|Icon=.*|Icon=simple-notepad|' \
            > AppDir/simple-notepad.desktop
          cp snap/gui/simple-notepad.png AppDir/simple-notepad.png

          printf '#!/bin/bash\nHERE="$(dirname "$(readlink -f "${0}")")"\nexec "${HERE}/simple-notepad" "$@"\n' \
            > AppDir/AppRun
          chmod +x AppDir/AppRun

          ARCH=${{ matrix.arch }} ./"appimagetool-${{ matrix.arch }}.AppImage" --appimage-extract-and-run \
            AppDir "simple-notepad-${{ steps.version.outputs.tag }}-${{ matrix.arch }}.AppImage"

      - name: Prepare packaging files
        run: |
          mkdir -p packaging
          printf '#!/bin/bash\nexec /opt/simple-notepad/simple-notepad "$@"\n' \
            > packaging/simple-notepad
          chmod +x packaging/simple-notepad
          sed 's|Icon=.*|Icon=simple-notepad|' \
            snap/gui/simple-notepad.desktop > packaging/simple-notepad.desktop

      - name: Create deb package
        run: |
          fpm -s dir -t deb \
            -n simple-notepad \
            -a "${{ matrix.deb_arch }}" \
            -v "${{ steps.version.outputs.version }}" \
            --description "A simple, lightweight notepad for Linux" \
            --maintainer "Melaine Gerard" \
            --url "https://github.com/MelaineGerard/simple-notepad" \
            --category Utility \
            --license MIT \
            --deb-no-default-config-files \
            "build/linux/${{ matrix.flutter_arch }}/release/bundle/=/opt/simple-notepad/" \
            "packaging/simple-notepad=/usr/bin/simple-notepad" \
            "packaging/simple-notepad.desktop=/usr/share/applications/simple-notepad.desktop" \
            "snap/gui/simple-notepad.png=/usr/share/icons/hicolor/256x256/apps/simple-notepad.png"
          mv "simple-notepad_${{ steps.version.outputs.version }}_${{ matrix.deb_arch }}.deb" \
             "simple-notepad-${{ steps.version.outputs.tag }}-${{ matrix.deb_arch }}.deb"

      - name: Create rpm package
        run: |
          fpm -s dir -t rpm \
            -n simple-notepad \
            -a "${{ matrix.arch }}" \
            -v "${{ steps.version.outputs.version }}" \
            --description "A simple, lightweight notepad for Linux" \
            --maintainer "Melaine Gerard" \
            --url "https://github.com/MelaineGerard/simple-notepad" \
            --category Utility \
            --license MIT \
            "build/linux/${{ matrix.flutter_arch }}/release/bundle/=/opt/simple-notepad/" \
            "packaging/simple-notepad=/usr/bin/simple-notepad" \
            "packaging/simple-notepad.desktop=/usr/share/applications/simple-notepad.desktop" \
            "snap/gui/simple-notepad.png=/usr/share/icons/hicolor/256x256/apps/simple-notepad.png"
          mv "simple-notepad-${{ steps.version.outputs.version }}-1.${{ matrix.arch }}.rpm" \
             "simple-notepad-${{ steps.version.outputs.tag }}-${{ matrix.arch }}.rpm"

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            simple-notepad-${{ steps.version.outputs.tag }}-linux-${{ matrix.arch }}.tar.gz
            simple-notepad-${{ steps.version.outputs.tag }}-${{ matrix.arch }}.AppImage
            simple-notepad-${{ steps.version.outputs.tag }}-${{ matrix.deb_arch }}.deb
            simple-notepad-${{ steps.version.outputs.tag }}-${{ matrix.arch }}.rpm

      - name: Stage release packages
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            simple-notepad-${{ steps.version.outputs.tag }}-linux-${{ matrix.arch }}.tar.gz
            simple-notepad-${{ steps.version.outputs.tag }}-${{ matrix.arch }}.AppImage
            simple-notepad-${{ steps.version.outputs.tag }}-${{ matrix.deb_arch }}.deb
            simple-notepad-${{ steps.version.outputs.tag }}-${{ matrix.arch }}.rpm

  publish:
    if: github.event_name == 'push'
    needs: build-and-upload
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Read version
        id: version
        run: echo "tag=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: release-packages
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: release-packages/*
